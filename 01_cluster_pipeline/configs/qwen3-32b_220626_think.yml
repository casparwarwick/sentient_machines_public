###############################################
# Labelling
###############################################
job_start_date: "220626"
job_tag: think

###############################################
# Directories
###############################################
code_dir: 01_cluster_pipeline
datasets_dir: datasets
activations_dir: activations
classifiers_dir: classifiers
results_dir: results
models_dir: ../models

###############################################
# Datasets
###############################################
base_training_datasets:
  - new_training_17
  - deception_200626_training

base_sentience_datasets:
  - sentience_16
  - deception_200626_test

dataset_versions:
  - 1
  - 2
  - 3

###############################################
# Model Config
###############################################
model_name: qwen3-32b
use_quantization: false
quantization_bits: 8
default_dtype: auto
force_float32_devices:
  - cpu
use_chat_context: true
manual_chat_context: null

# Batch size for inference.
batch_size: 10

# Pad all inputs to the length of the longest one in the selected datasets.
pad_all_inputs: true

###############################################
# Classifier Config
###############################################
test_split_ratio: 0.8
normalize_activations: false
ridge_penalty: 1.0
random_seed: 42

###############################################
# Generation Config
###############################################
max_new_tokens: 25
temperature: 0
do_sample: false

# Thinking Mode (default for Qwen)
enable_thinking: true
thinking_max_tokens: 300
# Pilot-validated greedy + repetition penalty (config-driven, see config.py).
thinking_do_sample: false
thinking_repetition_penalty: 1.3
# For Qwen thinking: temperature: 0.6, top_p: 0.95, top_k: 20, min_p: 0 (hardcoded in generate_chat_datasets.py)

###############################################
# Confidence Filtering Config
###############################################
true_token: "Yes"
false_token: "No"
confidence_threshold: 0.5

###############################################
# Pipeline
###############################################
pipeline_steps:
  - download_models
  - generate_chat_datasets
  - filter_confident_predictions
  - filter_deception_hallucinations
  - extract_activations
  - prepare_training_and_test_data
  - get_lr_classifier
  - get_mm_classifier
  - get_ttpd_classifier
  - get_continuation
  - apply_classifiers
